name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: football_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: football_db
      DB_USER: root
      DB_PASSWORD: root
      PORT: 3000

    defaults:
      run:
        working-directory: football-api/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: football-api/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar esquema
        run: npm run migrate

      - name: Importar fixture masculino
        run: npm run import:csv -- --file test/fixtures/male_players_fixture.csv --gender male

      - name: Importar fixture femenino
        run: npm run import:csv -- --file test/fixtures/female_players_fixture.csv --gender female

      - name: Compilar
        run: npm run build

      - name: Lint (sin --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Tests unitarios
        run: npm run test -- --passWithNoTests

      - name: Tests e2e contra MySQL
        run: npm run test:e2e