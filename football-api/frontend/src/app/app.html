<header class="topbar">
  <a class="brand" routerLink="/players">
    <span class="brand-mark">XA</span>
    <span>FIFA Players · XAcademy</span>
  </a>

  @if (auth.loggedIn()) {
    <nav class="topnav">
      <a routerLink="/players" routerLinkActive="active">Listado</a>
      <button type="button" class="link-btn" (click)="logout()">Salir</button>
    </nav>
    <span class="session-badge">sesión · JWT</span>
  }
</header>

<main>
  <router-outlet />
</main>
